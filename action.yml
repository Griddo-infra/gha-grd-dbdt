name: 'Volcado y restauración de RDS'
description: 'Volcado y restauración de MySQL/MariaDB RDS a través de Secrets Manager y S3'
author: 'Orencio Ramírez'
inputs:
  mode:
    description: 'Modo de operación: extraer | restaurar | preparar_red | limpiar_red'
    required: true
  secret_origin:
    description: 'Nombre del secreto de origen en AWS Secrets Manager'
    required: false
  secret_dest:
    description: 'Nombre del secreto de destino en AWS Secrets Manager'
    required: false
  presigned_url:
    description: 'URL pre-firmada S3 (necesaria en modo restaurar)'
    required: false
  ttl:
    description: 'TTL de la URL pre-firmada en segundos'
    required: false
    default: '7200'
  backup_before_restore:
    description: 'Hacer un backup del destino antes de restaurar (true/false). Solo aplica en modo restaurar.'
    required: false
    default: 'true'
  network_scope:
    description: 'Identificador de la red de runner (tag dbdt:scope). Necesario en modos preparar_red y limpiar_red.'
    required: false
  aws_region:
    description: 'Región AWS (eu-south-2 por ejemplo)'
    required: true

outputs:
  presigned_url:
    description: "URL pre-firmada generada tras el volcado"
    value: ${{ steps.run_script.outputs.presigned_url }}
  backup_presigned_url:
    description: "URL pre-firmada del backup del destino realizado antes de restaurar (solo si backup_before_restore=true)"
    value: ${{ steps.run_script.outputs.backup_presigned_url }}
  nat_gateway_id:
    description: "ID del NAT gateway efímero creado o reutilizado (solo en modo preparar_red)"
    value: ${{ steps.run_script.outputs.nat_gateway_id }}

runs:
  using: "composite"
  steps:
    - name: Instalar Dependencias
      shell: bash
      run: |
        # Soporta runners Ubuntu (GitHub-hosted / CodeBuild standard) y Amazon Linux (CodeBuild amazonlinux)
        # El cliente MySQL solo hace falta en los modos que tocan la base de datos
        case "${{ inputs.mode }}" in
          extraer|restaurar) MYSQL_APT="mysql-client"; MYSQL_DNF="mariadb105" ;;
          *) MYSQL_APT=""; MYSQL_DNF="" ;;
        esac
        if command -v apt-get >/dev/null 2>&1; then
          # apt-get update puede fallar por mirrors transitoriamente rotos de repos
          # de la imagen base que no usamos (ej. packages.mozilla.org a mitad de sync):
          # se reintenta y, si no se recupera, se instala con los índices disponibles
          actualizado=false
          for intento in 1 2 3; do
            if sudo apt-get update; then actualizado=true; break; fi
            echo "⚠️ apt-get update falló (intento ${intento}/3)"
            sleep 10
          done
          if [ "$actualizado" = false ]; then
            echo "⚠️ apt-get update no se recuperó; se intenta instalar con los índices disponibles"
          fi
          sudo apt-get install -y jq gzip curl unzip $MYSQL_APT
        elif command -v dnf >/dev/null 2>&1; then
          sudo dnf install -y jq gzip curl unzip $MYSQL_DNF
        else
          echo "❌ Gestor de paquetes no soportado (se esperaba apt-get o dnf)"
          exit 1
        fi

    - name: Install AWS CLI v2
      shell: bash
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update
        rm -rf awscliv2.zip aws

    - name: Ejecutar Volcado y restauración de RDS
      id: run_script
      shell: bash
      run: |
        chmod +x ${{ github.action_path }}/entrypoint.sh
        case "${{ inputs.mode }}" in
          extraer)
            AWS_REGION="${{ inputs.aws_region }}" ${{ github.action_path }}/entrypoint.sh extraer \
              "${{ inputs.secret_origin }}" \
              "${{ inputs.ttl }}"
            ;;
          restaurar)
            AWS_REGION="${{ inputs.aws_region }}" ${{ github.action_path }}/entrypoint.sh restaurar \
              "${{ inputs.secret_dest }}" \
              "${{ inputs.presigned_url }}" \
              "${{ inputs.backup_before_restore }}" \
              "${{ inputs.ttl }}"
            ;;
          preparar_red)
            AWS_REGION="${{ inputs.aws_region }}" ${{ github.action_path }}/entrypoint.sh preparar_red \
              "${{ inputs.network_scope }}"
            ;;
          limpiar_red)
            AWS_REGION="${{ inputs.aws_region }}" ${{ github.action_path }}/entrypoint.sh limpiar_red \
              "${{ inputs.network_scope }}"
            ;;
          *)
            echo "Modo no soportado: ${{ inputs.mode }}"
            exit 1
            ;;
        esac
